[project]
name = "moe-newsletter-rag-dashboard"
version = "1.0.0"
description = "Ministry of Education newsletter dashboard with a retrieval-first (RAG) chatbot and optional Ollama summarisation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akshat Banga" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "httpx>=0.25.0", "ruff>=0.5.0"]
faiss = ["faiss-cpu>=1.7.4"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["attached_assets"]

[tool.ruff.lint]
# Correctness-focused: syntax errors, undefined names, unused imports, etc.
select = ["E9", "F"]
